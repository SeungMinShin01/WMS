# - main, develop, feature/** 브랜치에 push될 때 돈다
#   (feature에서 먼저 빌드 확인 → 통과하면 develop에 올린다)
# - 배포(CD)는 아직 없음. 서버가 생기면 cd.yml을 따로 추가한다.

name: WMS CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 세팅
      - name: set java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 2. Gradle 세팅 + 캐시 (funda의 pnpm store 캐시와 같은 역할)
      - name: set gradle
        uses: gradle/actions/setup-gradle@v4

      # 3. 빌드 (컴파일 + jar 생성)
      #    -x test : 테스트는 일단 뺀다. 테스트가 MySQL에 붙어야 해서 CI에서 실패하기 때문.
      - name: build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon
