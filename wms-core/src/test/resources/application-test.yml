spring:
  flyway:
    locations: classpath:db/migration # 테스트는 시드 제외 (@Sql sample2.sql 사용)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/wms_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}

logging:
  level:
    org.hibernate.SQL: warn

auth:
  enabled: false
