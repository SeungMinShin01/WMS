spring:
  application:
    name: wms-backend
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate # JPA가 테이블을 만들거나 바꾸지 않고 엔티티와 DB가 맞는지만 검사
    open-in-view: false # 	DB 연결을 서비스 계층 안에서만 쓴다. 컨트롤러에서 지연 로딩을 하다 생기는 문제를 막음
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration # db/migration 폴더의 V1__…, V2__…를 순서대로 실행

logging:
  level:
    org.hibernate.SQL: debug # 실행되는 SQL을 로그에 출력. 쿼리가 몇 번 나가는지 볼 수 있음
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: wms-core
    distribution:
      percentiles-histogram:
        http.server.requests: true
# ED-65 적재 비동기 실험 설정 (실행할 때 --args 로 바꿔 끼운다)
carry:
  pool:
    core: 1
    max: 1
    queue: 100
  sync: false