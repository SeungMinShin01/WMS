# 모니터링 스택 (앱 compose 와 분리: 브랜치를 바꿔 앱을 다시 띄워도 측정 데이터 유지)
# 실행: cd monitoring  →  docker compose up -d
services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver # k6 가 지표를 밀어 넣을 수 있게
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # 리눅스(EC2)에서도 호스트의 8080 에 접근

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: <기존 값 그대로>
      # 패널을 PNG 로 만들어 주는 렌더러 연결 (scripts/perf/grafana-png.ps1 이 사용)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # 로컬 측정용: 로그인 없이 보기 전용 (PNG 스크립트가 로그인 없이 받아 가려고)
      # EC2 등 외부에서 접속 가능한 서버에는 이 두 줄을 넣지 말 것
      # Grafana ↔ 렌더러가 서로 확인하는 토큰 (Grafana 13 부터 기본값 금지). renderer 의 AUTH_TOKEN 과 같아야 함
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:-wms-local-render-token}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - renderer

  # 패널 → PNG 변환 (헤드리스 크롬). 포트를 밖으로 열 필요 없음 (grafana 만 내부에서 호출)
  renderer:
    image: grafana/grafana-image-renderer:latest
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:-wms-local-render-token}

volumes:
  prometheus-data:
  grafana-data:
